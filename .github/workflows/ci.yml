name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Run frontend tests
        run: |
          cd frontend
          npx vitest run --reporter=basic

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/soar-service
          - services/log-ingestion-service
          - services/identity-service
          - services/correlation-service
          - services/incident-management-service
          - services/threat-feed
          - services/ml-analytics-service
          - services/data-archiver
          - services/sigma-converter
          - services/ai-assistant-service
          - services/flow-collector
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install deps
        run: |
          cd ${{ matrix.service }}
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest
      - name: Lint with flake8
        run: |
          cd ${{ matrix.service }}
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run pytest
        run: |
          cd ${{ matrix.service }}
          if [ -d tests ]; then pytest -q; else echo "No tests directory"; fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          docker compose config --quiet
      - name: Validate gateway nginx config
        run: |
          docker run --rm -v "$PWD/services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine nginx -t
      - name: Build all Docker images
        run: |
          docker compose build

  agent-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/agent/requirements.txt
      - name: Validate agent modules
        run: |
          cd services/agent
          pip install -r requirements.txt
          python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) or print(f + ' OK') for f in sorted(glob.glob('*.py'))]"