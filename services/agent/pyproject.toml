[project]
name = "chael-agent"
version = "1.0.0"
description = "Chael SIEM lightweight endpoint agent — ships logs to any Chael SIEM server (Track B shipper)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
keywords = ["siem", "security", "monitoring", "log-shipper", "soc"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: System :: Logging",
]
dependencies = [
  "requests>=2.31.0",
  "psutil>=5.9.0",
  "watchdog>=4.0.0",
  "pyyaml>=6.0",
  "cryptography>=41.0.0",
]

[project.optional-dependencies]
docker = ["docker>=6.1.0"]
yara = ["yara-python>=4.5.0"]
windows = ["pywin32>=306; sys_platform == 'win32'"]
all = ["docker>=6.1.0", "yara-python>=4.5.0", "pywin32>=306; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/Micatob/chael"
Documentation = "https://github.com/Micatob/chael/blob/main/AGENT_DEPLOYMENT.md"

[project.scripts]
chael-agent = "agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "agent",
  "response",
  "pre_filter",
  "agent_registration",
  "yara_scanner",
  "registry_monitor",
  "docker_monitor",
  "cis_benchmark",
  "vuln_scanner",
  "auto_update",
  "version",
]
