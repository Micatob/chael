worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;
    include /etc/nginx/mime.types;

    # Docker DNS resolver (ipv6 off prevents "unexpected DNS response" on 127.0.0.11)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=agent_limit:10m rate=50r/s;

    # HTTPS server
    server {
        listen 8443 ssl;
        server_name chael-siem.local;

        ssl_certificate /etc/nginx/certs/chael.crt;
        ssl_certificate_key /etc/nginx/certs/chael.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        error_page 401 = @error_401;
        error_page 403 = @error_403;
        location @error_401 {
            default_type application/json;
            return 401 '{"error":"Unauthorized","message":"Authentication required"}';
        }
        location @error_403 {
            default_type application/json;
            return 403 '{"error":"Forbidden","message":"Insufficient permissions"}';
        }

        # Internal auth sub-request endpoint for nginx auth_request
        # Uses variable-based proxy_pass for dynamic DNS resolution (prevents stale IP cache on container restart)
        location /_auth {
            internal;
            set $upstream_auth identity-service;
            proxy_pass http://$upstream_auth:8004/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            set $upstream_auth identity-service;
            proxy_pass http://$upstream_auth:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Agent registration/verification/heartbeat — no auth_request (identity-service validates internally)
        location /api/agents/ {
            limit_req zone=auth_limit burst=10 nodelay;
            set $upstream_auth identity-service;
            proxy_pass http://$upstream_auth:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Agent heartbeat — no auth required (endpoint validates internally)
        location /api/logs/heartbeat {
            limit_req zone=ingest_limit burst=50 nodelay;
            set $upstream_logs log-ingestion-service;
            proxy_pass http://$upstream_logs:8080/api/logs/heartbeat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/logs/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=ingest_limit burst=50 nodelay;
            set $upstream_logs log-ingestion-service;
            proxy_pass http://$upstream_logs:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WebSocket proxy for real-time log streaming
        location /api/logs/ws {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=ingest_limit burst=50 nodelay;
            set $upstream_logs log-ingestion-service;
            proxy_pass http://$upstream_logs:8080/api/logs/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
        }

        location /api/incidents/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_incidents incident-management-service;
            proxy_pass http://$upstream_incidents:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/analytics/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_analytics incident-management-service;
            proxy_pass http://$upstream_analytics:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/soar/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_soar soar-service;
            proxy_pass http://$upstream_soar:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/correlation/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_correlation correlation-service;
            proxy_pass http://$upstream_correlation:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/threat-feed/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_threat_feed threat-feed;
            proxy_pass http://$upstream_threat_feed:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        location /api/ml/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_ml ml-analytics-service;
            proxy_pass http://$upstream_ml:8084;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/flows/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_flow flow-collector;
            proxy_pass http://$upstream_flow:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/sigma/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_sigma sigma-converter;
            proxy_pass http://$upstream_sigma:8091;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ai/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=api_limit burst=10 nodelay;
            set $upstream_ai ai-assistant-service;
            proxy_pass http://$upstream_ai:8093;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /api/backup/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=api_limit burst=5 nodelay;
            set $upstream_backup data-archiver;
            proxy_pass http://$upstream_backup:8092;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }

        location /api/audit/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_logs log-ingestion-service;
            proxy_pass http://$upstream_logs:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            return 404 '{"error":"API endpoint not found"}';
        }

        # Serve agent files for remote deployment (Wazuh-style one-liner)
        location /api/agent/download/ {
            alias /opt/chael/agent-files/;
            autoindex on;
        }

        location /api/agent/static/ {
            alias /opt/chael/agent-files/;
        }

        location /health {
            limit_req zone=api_limit burst=5 nodelay;
            return 200 '{"status":"healthy","service":"gateway"}';
            add_header Content-Type application/json;
        }
    }

    # HTTP server — now mirrors HTTPS auth enforcement (Fix 2026-09-01)
    # Public: /api/auth/, /api/agents/*, /api/logs/heartbeat, /health, agent files
    # Protected: /api/logs/, /api/incidents/, /api/analytics/, /api/soar/, etc. via auth_request
    server {
        listen 8000;
        server_name _;

        error_page 401 = @error_401;
        error_page 403 = @error_403;
        location @error_401 {
            default_type application/json;
            return 401 '{"error":"Unauthorized","message":"Authentication required"}';
        }
        location @error_403 {
            default_type application/json;
            return 403 '{"error":"Forbidden","message":"Insufficient permissions"}';
        }

        location /_auth {
            internal;
            set $upstream_auth identity-service;
            proxy_pass http://$upstream_auth:8004/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # Agent deployment files — served over HTTP for bootstrap one-liner
        location /api/agent/download/ {
            alias /opt/chael/agent-files/;
            autoindex on;
        }
        location /api/agent/static/ {
            alias /opt/chael/agent-files/;
        }

        location /api/auth/ {
            set $upstream_auth identity-service;
            proxy_pass http://$upstream_auth:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        # Agent registration/verification/heartbeat (identity-service validates internally) — NO auth_request
        location /api/agents/ {
            limit_req zone=auth_limit burst=10 nodelay;
            set $upstream_auth identity-service;
            proxy_pass http://$upstream_auth:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        # Log source heartbeat — NO auth (agents report before JWT)
        location = /api/logs/heartbeat {
            limit_req zone=ingest_limit burst=50 nodelay;
            set $upstream_logs log-ingestion-service;
            proxy_pass http://$upstream_logs:8080/api/logs/heartbeat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        # Protected log ingestion — requires JWT
        location /api/logs/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            limit_req zone=agent_limit burst=100 nodelay;
            set $upstream_logs log-ingestion-service;
            proxy_pass http://$upstream_logs:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/incidents/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            set $upstream_incidents incident-management-service;
            proxy_pass http://$upstream_incidents:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/analytics/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            set $upstream_analytics incident-management-service;
            proxy_pass http://$upstream_analytics:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/soar/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            set $upstream_soar soar-service;
            proxy_pass http://$upstream_soar:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/correlation/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            set $upstream_correlation correlation-service;
            proxy_pass http://$upstream_correlation:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/threat-feed/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            set $upstream_threat_feed threat-feed;
            proxy_pass http://$upstream_threat_feed:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/ml/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            set $upstream_ml ml-analytics-service;
            proxy_pass http://$upstream_ml:8084;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/flows/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            set $upstream_flow flow-collector;
            proxy_pass http://$upstream_flow:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/sigma/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            set $upstream_sigma sigma-converter;
            proxy_pass http://$upstream_sigma:8091;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/ai/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            set $upstream_ai ai-assistant-service;
            proxy_pass http://$upstream_ai:8093;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
        location /api/backup/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            set $upstream_backup data-archiver;
            proxy_pass http://$upstream_backup:8092;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        location /api/audit/ {
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            set $upstream_logs log-ingestion-service;
            proxy_pass http://$upstream_logs:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/ {
            return 404 '{"error":"API endpoint not found"}';
        }

        # Health check — public
        location /health {
            return 200 '{"status":"healthy","service":"gateway"}';
            add_header Content-Type application/json;
        }

        # All other traffic → HTTPS (kept, but API already handled)
        location / {
            return 301 https://$host:8443$request_uri;
        }
    }
}
