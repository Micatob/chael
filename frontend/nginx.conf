resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Timeouts to prevent 499 client-closed on slow gateway auth
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — keep gateway HTTPS but add proper buffering and error handling
    location /api/ {
        set $upstream https://gateway:8443;
        proxy_pass $upstream;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # Forward cookies for auth fallback
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_intercept_errors on;
        error_page 401 = @api_401;
        error_page 403 = @api_403;
    }

    # Dedicated auth endpoint — faster timeout
    location = /api/auth/login {
        set $upstream https://gateway:8443;
        proxy_pass $upstream;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 10s;
    }

    location @api_401 {
        default_type application/json;
        return 401 '{"detail":"Not authenticated","code":"token_missing_or_expired"}';
    }
    location @api_403 {
        default_type application/json;
        return 403 '{"detail":"Insufficient permissions"}';
    }

    # WebSocket proxy for real-time logs — gateway HTTPS ws
    location /api/logs/ws {
        set $upstream_ws https://gateway:8443;
        proxy_pass $upstream_ws;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400s;
    }

    # Socket.IO proxy — gateway HTTPS ws
    location /socket.io/ {
        set $upstream_ws https://gateway:8443;
        proxy_pass $upstream_ws;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Fallback for legacy /ws path (vite dev)
    location /ws {
        set $upstream_ws https://gateway:8443;
        proxy_pass $upstream_ws;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    error_page 404 /index.html;
}